<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b1526">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="New Song">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>New Song Songbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
/* VOICE: steady and practical, a music stand at rehearsal, readable at arm's length
   IDEA: a hymnal's cloth cover opening onto a lead sheet
   PICTURE: the song index and the live, transposable chord chart themselves
   COLOUR and TYPE: burgundy cloth band, white page, chord-ink blue; Literata for titles and lyrics, Figtree for controls
   LAYOUT: index column left, chart right; one column on phones with a back button */
:root{--bg:#fff;--ink:#1d1416;--mute:#6d5e62;--line:#ebe3e5;--soft:#f8f3f4;--cloth:#5b1526;--chord:#1c58c9;--hi:#fbe9ec;--danger:#b3261e;--bass:#a84f00;--ok:#22603a;--warn:#7a4100;--warnbg:#fff1e0}
@media (prefers-color-scheme:dark){:root{--bg:#120b0e;--ink:#f3ecee;--mute:#b7a7ac;--line:#2e2226;--soft:#1b1215;--cloth:#3a0d19;--chord:#8ab6ff;--hi:#2b151b;--danger:#ff8a80;--bass:#ffb366;--ok:#8fd6a8;--warn:#ffcf99;--warnbg:#3a2410}}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Literata,Georgia,serif;font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
h3{font-size:22px;margin-top:32px}
a{color:var(--chord)}
button,input,select,textarea{font:inherit;color:inherit}
button,.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;text-decoration:none;color:inherit}
button:hover,.btn:hover{background:var(--soft)}
button.pri,.btn.pri{background:var(--cloth);border-color:var(--cloth);color:#fff}
button.ghost{border-color:transparent;background:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible,.btn:focus-visible{outline:3px solid var(--chord);outline-offset:2px}
input,select,textarea{font-size:16px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:15px}
label{display:block;font-size:14px;font-weight:600;color:var(--mute);margin:14px 0 6px}
/* shell: a slim cloth band on top; on phones the sections move to a bar under your thumb */
header{background:var(--cloth);color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.hdin{display:flex;align-items:center;gap:20px;max-width:1440px;margin:0 auto;padding:10px max(3vw,16px);min-height:64px}
.brand{display:flex;gap:12px;align-items:center;color:#fff;text-decoration:none;flex:none}
.brand svg{width:40px;height:40px;flex:none}
h1{font-size:24px}
#church{margin:1px 0 0;opacity:.8;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button{background:transparent;border:0;color:#fff;opacity:.82;border-radius:999px;padding:0 16px;gap:8px;min-height:40px}
.tabs button svg{width:20px;height:20px;flex:none}
.tabs button:hover{background:rgba(255,255,255,.12);opacity:1}
.tabs button[aria-current=true]{background:#fff;color:var(--cloth);opacity:1}
.bar{display:flex;gap:8px;padding:10px max(3vw,16px);border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center;position:sticky;top:var(--hh,64px);background:var(--bg);z-index:10}
.search{position:relative;flex:1 1 260px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mute);pointer-events:none}
.search input{padding-left:40px;border-radius:999px;background:var(--soft);border-color:transparent}
.search input:focus{background:var(--bg);border-color:var(--line)}
.bar select{flex:0 1 190px;width:auto;border-radius:999px}
.bar .icon{width:44px;border-radius:999px}
.bar .icon svg{width:20px;height:20px}
#status{font-size:13px;color:var(--mute);flex:1 1 100%;margin-top:-2px}
#status:empty{display:none}
.wrap{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);max-width:1440px;margin:0 auto;width:100%;min-height:70vh}
#list{border-right:1px solid var(--line);padding:4px 0 24px;position:sticky;top:var(--top,128px);align-self:start;max-height:calc(100vh - var(--top,128px));max-height:calc(100dvh - var(--top,128px));overflow:auto;overscroll-behavior:contain}
#detail{padding:24px max(3vw,20px) 64px;max-width:980px;width:100%}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:12px 20px;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-radius:0;font-weight:400;min-height:64px;color:inherit;text-decoration:none;align-items:center;position:relative}
.row:hover{background:var(--soft)}
.row[aria-current=true]{background:var(--hi)}
.row[aria-current=true]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--cloth)}
.row .t{font-family:Literata,serif;font-size:17px;font-weight:600;line-height:1.3}
.row .s{color:var(--mute);font-size:14px;line-height:1.4;grid-column:1}
.row .k{grid-column:2;grid-row:1 / span 2;align-self:center;text-align:right;white-space:nowrap}
.key{display:inline-block;min-width:40px;padding:3px 8px;border-radius:8px;background:var(--cloth);color:#fff;font-weight:700;text-align:center;font-size:15px}
.key.none{background:var(--soft);color:var(--mute)}
.meta{color:var(--mute);font-size:14px;white-space:nowrap}
.hd{padding:16px 20px 6px;font-size:13px;font-weight:700;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;position:sticky;top:0;background:var(--bg);z-index:1;border-bottom:1px solid var(--line)}
.listtop{padding:12px 20px 4px}
.empty{padding:28px 20px;color:var(--mute)}
.back{display:none;margin:-8px 0 12px -10px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
h2{font-size:clamp(28px,4vw,42px)}
.by{color:var(--mute);margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:20px 0}
.facts div{background:var(--soft);border-radius:12px;padding:10px 14px}
.facts div{display:flex;flex-direction:column}
.facts small{font-size:13px;color:var(--mute);font-weight:600}
.facts strong{font-size:22px;white-space:nowrap}
#pulse{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--line);vertical-align:middle;margin-left:6px}
#pulse.on{animation:p .18s ease-out}#pulse.one{background:var(--chord)}
@keyframes p{from{transform:scale(1.7);background:var(--chord)}}
@media (prefers-reduced-motion:reduce){#pulse.on{animation:none;background:var(--chord)}}
.arr{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.arr span{padding:4px 10px;border-radius:8px;background:var(--soft);border:1px solid var(--line);font-weight:600;font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:20px 0 8px;padding:10px;background:var(--soft);border-radius:14px}
.tools .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tools select{width:auto}
.tools .sep{width:1px;height:28px;background:var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0}.seg button[aria-pressed=true]{background:var(--cloth);color:#fff}
.seg select{border:0;border-radius:0;width:auto}
.capo{font-size:14px;color:var(--mute);margin:4px 0 0}
.chart{--cs:19px;font-family:Literata,Georgia,serif;font-size:var(--cs);margin-top:8px}
.chart .ln{margin:0;line-height:1.35}
.chart .hc{padding-top:2px}
.chart .w{display:inline-block;white-space:pre}
.chart .w b{display:block;font-family:Figtree,sans-serif;font-weight:700;color:var(--chord);font-size:.88em;padding-right:.45em;min-height:1.3em}
.chart .sec{font-family:Figtree,sans-serif;font-size:15px;color:var(--mute);margin:22px 0 4px;font-weight:700}
.chart .gap{height:.7em}
.notes{white-space:pre-wrap;background:var(--soft);padding:14px 16px;border-radius:12px;margin-top:20px}
.links a{margin-right:14px;overflow-wrap:anywhere}
.tk{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tk span{font-size:14px;padding:4px 10px;border:1px solid var(--line);border-radius:999px}
.ref{display:inline-flex;align-items:center;padding:2px 12px;border-radius:999px;background:var(--hi);border:0;font-weight:600;font-size:15px;margin:0 6px 6px 0;min-height:32px}
.help{font-size:14px;color:var(--mute);margin:6px 0 0}
.item{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.item .n,.homerow .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--soft);font-family:Figtree,sans-serif;font-size:14px;font-weight:700;color:var(--mute);flex:none}
.item .row{padding:10px 0;border:0;display:block;min-height:0}.item .row:hover{background:none}.item .row .t{display:block}.item .row .s{display:block;margin-top:2px}
.nextsong{display:flex;justify-content:space-between;gap:12px;margin-top:36px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.pv{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.pv input{width:22px;height:22px;min-height:0;margin-top:3px}
.pv small{color:var(--mute);display:block}
.dup{color:var(--danger)}
ol.steps{padding-left:22px}ol.steps li{margin:6px 0}
code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:.92em}
.hero{background:var(--cloth);color:#fff;border-radius:20px;padding:24px 22px;display:flex;flex-direction:column;gap:4px;background-image:radial-gradient(120% 140% at 100% 0,rgba(255,255,255,.12),transparent 60%)}
.hero h2{color:#fff;font-size:clamp(32px,5vw,44px)}.hero .hk{font-size:14px;font-weight:600;opacity:.88}.hero .hs{font-size:16px;opacity:.88}
.homerow .t{display:flex;gap:12px;align-items:center}
.homerow{padding-left:0;padding-right:0}.homerow .s{padding-left:42px}
.btn.big{min-height:54px;padding:0 26px;font-size:17px}.grow{flex:1 1 auto;justify-content:center}
.partpick{margin-top:26px}.parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.parts button{padding:0 6px;justify-content:center}.parts button[aria-pressed=true]{background:var(--cloth);border-color:var(--cloth);color:#fff}
.tip{margin-top:20px;padding:12px 14px;background:var(--soft);border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;background:var(--hi);font-weight:600;font-size:14px;border:0;color:var(--ink)}
.chip.add,.chip.pick{background:var(--bg);border:1px solid var(--line);cursor:pointer}
.chip.pick[aria-pressed=true]{background:var(--cloth);border-color:var(--cloth);color:#fff}
.found{display:flex;align-items:center;gap:6px;margin:14px 0 8px;font-size:14px;font-weight:700;color:var(--ok)}
.warn{display:inline-block;align-self:flex-start;font-size:13px;font-weight:600;color:var(--warn);background:var(--warnbg);padding:2px 8px;border-radius:6px}
.warntext{color:var(--warn);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.inl{display:flex;gap:8px}.inl input{flex:1}
details{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:4px 14px 14px}details summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
.preview{border:1px solid var(--line);border-radius:12px;padding:8px 14px;max-height:340px;overflow:auto}
.bar2{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 0;display:flex;gap:8px;margin-top:20px;z-index:2}
.sermon{margin-top:16px;padding:12px 14px;background:var(--soft);border-radius:14px}.sermon .chips{margin-top:6px}
.edrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto 44px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);background:var(--bg)}
.edrow.drag{background:var(--hi);box-shadow:0 6px 18px rgba(0,0,0,.12);position:relative;z-index:3}
.edmain{display:flex;flex-direction:column;gap:4px}.edmain .t{font-family:Literata,serif;font-weight:600;font-size:16px}
.edmain .nt{min-height:36px;padding:4px 10px;font-size:15px}
.handle{border:0;background:transparent;padding:0;min-height:44px;justify-content:center;cursor:grab;touch-action:none;color:var(--mute)}
.keysel{width:auto;min-height:40px;padding:4px 8px;background:var(--cloth);color:#fff;border:0;font-weight:700;border-radius:8px}
.icon{padding:0;justify-content:center}
.resrow{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0;font-weight:400;background:transparent}
.resrow small{display:block;color:var(--mute);font-size:13px}
.linkish{background:none;border:0;padding:0;min-height:0;color:var(--chord);text-decoration:underline;font-weight:600;cursor:pointer;display:inline}
.danger{color:var(--danger)}
.bassv .w b{color:var(--bass)}
.concert{font-size:13px;color:var(--mute);font-weight:600}
.ord{font-weight:600;font-size:15px;line-height:1.3}
.stagetop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-8px 0 0 -10px}
.stagebar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:5}
.stagebar .row2{display:flex;gap:8px;align-items:center;max-width:900px;width:100%;margin:0 auto}
body.stage{--bg:#120b0e;--ink:#f3ecee;--mute:#b7a7ac;--line:#2e2226;--soft:#1b1215;--chord:#8ab6ff;--hi:#2b151b;--bass:#ffb366}
body.stage header,body.stage .bar,body.stage #list,body.stage #gate{display:none}
body.stage{--nav:0px}body.stage main{padding-bottom:0}
body.stage .wrap{grid-template-columns:minmax(0,1fr)}
body.stage #detail{display:block!important;padding:18px 18px 160px;max-width:900px;margin:0 auto;width:100%}
.ccli{width:100%;border-collapse:collapse;font-size:15px}.ccli th{text-align:left;font-size:13px;color:var(--mute);padding:8px 10px 6px 0;border-bottom:1px solid var(--line)}
.ccli td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}.ccli td small{display:block;color:var(--mute);font-size:13px}.ccli .num{text-align:right;white-space:nowrap}.scroll{overflow-x:auto}
@media(max-width:600px){.ccli thead{display:none}.ccli tr{display:grid;padding:8px 0;border-bottom:1px solid var(--line)}.ccli td{display:flow-root;border:0;padding:3px 0 3px 6.5em;text-align:left}.ccli td::before{content:attr(data-l);float:left;width:6em;margin-left:-6.5em;color:var(--mute);font-size:13px}.ccli .num{text-align:left}}
#gate{padding:clamp(28px,6vw,72px) max(5vw,16px);max-width:520px}
body.gated .bar,body.gated main,body.gated .tabs{display:none}body.gated{--nav:0px}
.notice{margin-top:24px;padding-top:10px;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(24px + var(--nav,0px));z-index:30;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
@media(max-width:1100px){.tabs button{padding:0 12px}.tabs button svg{display:none}}
@media(max-width:759px){
  .wrap{grid-template-columns:minmax(0,1fr)}#list{border-right:0;position:static;max-height:none;overflow:visible}
  body.sel #list,body.sel .bar{display:none}body:not(.sel) #detail{display:none}.back{display:inline-flex}
  body{--nav:calc(64px + env(safe-area-inset-bottom))}
  .hdin{min-height:56px;padding:8px 16px}.brand svg{width:34px;height:34px}h1{font-size:21px}
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--bg);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));z-index:20;box-shadow:0 -4px 16px rgba(0,0,0,.05)}
  .tabs button{flex-direction:column;gap:2px;color:var(--mute);opacity:1;font-size:12px;font-weight:600;min-height:52px;padding:4px 2px;border-radius:12px}
  .tabs button svg{display:block;width:24px;height:24px}
  .tabs button:hover{background:var(--soft)}
  .tabs button[aria-current=true]{background:var(--hi);color:var(--cloth)}
  main,#gate{padding-bottom:var(--nav)}
  .hd{top:var(--hh,56px)}
  .bar{position:static;padding:10px 16px}.search{flex:1 1 100%}
  .bar select{flex:1 1 0}
  .facts{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.facts div{padding:8px 10px}
  #detail{padding:18px 16px 40px}
  .bar2{bottom:var(--nav)}
}
@media(max-width:759px) and (prefers-color-scheme:dark){.tabs button[aria-current=true]{color:#ffb3c1}}
@media(max-width:600px){.parts{grid-template-columns:repeat(4,minmax(0,1fr))}.edrow{grid-template-columns:36px minmax(0,1fr) auto 40px}.chart{--cs:18px}.facts strong{font-size:19px}.two{grid-template-columns:minmax(0,1fr)}
  .top{flex-direction:column}.top .acts{width:100%}.top .acts>*{flex:1 1 auto;justify-content:center}
  .tools{padding:8px}.tools .sep{display:none}.tools .grp{width:100%}.tools .grp>*{flex:1 1 auto;justify-content:center}.tools .seg{display:flex;width:100%}.tools .seg button{flex:1;justify-content:center}
  .hero{padding:20px 18px}.homerow .s{padding-left:42px}}
@media print{header,.bar,#list,.tools,.acts,.back,.nextsong{display:none!important}.wrap{display:block}}
@media (hover:none){.row:hover,button:hover,.btn:hover{background:inherit}.row[aria-current=true]{background:var(--hi)}button.pri:hover,.btn.pri:hover{background:var(--cloth)}}
</style>
</head>
<body>
<header>
  <div class="hdin">
  <a class="brand" href="#" aria-label="New Song, This Sunday">
    <svg viewBox="0 0 46 46" aria-hidden="true"><rect x="1" y="1" width="44" height="44" rx="10" fill="#fff" opacity=".12"/><g stroke="#fff" stroke-width="1.4" opacity=".85"><line x1="7" y1="14" x2="39" y2="14"/><line x1="7" y1="19" x2="39" y2="19"/><line x1="7" y1="24" x2="39" y2="24"/><line x1="7" y1="29" x2="39" y2="29"/><line x1="7" y1="34" x2="39" y2="34"/></g><ellipse cx="19" cy="31.5" rx="4.6" ry="3.4" transform="rotate(-20 19 31.5)" fill="#fff"/><path d="M23.2 30V9.5c4 1.5 7.5 3.6 8.5 8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
    <div><h1>New Song</h1><p id="church">Music ministry songbook</p></div>
  </a>
  <nav class="tabs" aria-label="Sections">

function csvRows(txt){

    if(en.note){doc.setFont('helvetica','italic');doc.setTextColor(60);const t=doc.splitTextToSize(clean(en.note),MX-M);doc.text(t,M,y);y+=t.length*12+2}
    doc.setDrawColor(210);doc.line(M,y+2,MX,y+2);y+=20;
    const from=s.key||'C',to=mode==='ch'?shape:en.key,d=(idx(to)-idx(from)+12)%12,fl=flats(to);
    for(const line of String(s.chart||'').split('\n')){
      const t=line.trim(),h=t.match(/^\{(?:c|comment|ci)\s*:\s*(.*)\}$/i);
      if(h||(SECRX.test(t)&&t.length<32)){need(40);y+=6;doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(110);doc.text(clean(h?h[1]:t.replace(/:$/,'')),M,y);y+=15;continue}
      if(/^\{.*\}$/.test(t))continue;
      if(!t){y+=8;continue}
      const p=line.split(/\[([^\]]*)\]/);
      if(mode==='lyr'){const s2=p.filter((_,i)=>i%2===0).join('').replace(/\s+/g,' ').trim();if(!s2)continue;doc.setFont('times','normal');doc.setFontSize(12.5);doc.setTextColor(25);for(const r of doc.splitTextToSize(clean(s2),MX-M)){need(17);doc.text(r,M,y);y+=17}continue}
      const toks=[];
      const push=(ch,txt)=>{const parts=txt?txt.split(/(?<=\s)/):[''];parts.forEach((w,i)=>toks.push({ch:i===0?ch:null,t:clean(w)}))};
      if(p[0])push(null,p[0]);
      for(let i=1;i<p.length;i+=2)push(clean(tChord(p[i],d,fl,mode,to)),p[i+1]||'');
      let row=[],x=M,ce=M;const rows=[];
      for(const tk of toks){
        doc.setFont('times','normal');doc.setFontSize(12.5);const tw=doc.getTextWidth(tk.t);
        doc.setFont('helvetica','bold');doc.setFontSize(10.5);const cw=tk.ch?doc.getTextWidth(tk.ch)+5:0;
        let cx=tk.ch?Math.max(x,ce):x;
        if(row.length&&cx+Math.max(tw,cw)>MX){rows.push(row);row=[];x=M;ce=M;cx=M}
        row.push({...tk,x:cx});x=cx+tw;if(tk.ch)ce=cx+cw;
      }
      if(row.length)rows.push(row);
      for(const r of rows){
        const hc=r.some(z=>z.ch);need(hc?30:17);
        if(hc){doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(...BLUE);r.forEach(z=>z.ch&&doc.text(z.ch,z.x,y));y+=13}
        doc.setFont('times','normal');doc.setFontSize(12.5);doc.setTextColor(25);r.forEach(z=>z.t&&doc.text(z.t,z.x,y));y+=hc?17:16;
      }
    }
    if(s.notes){need(40);y+=8;doc.setFont('helvetica','italic');doc.setFontSize(10);doc.setTextColor(90);const t=doc.splitTextToSize(clean(s.notes),MX-M);doc.text(t,M,y);y+=t.length*12}
    const nt=notice(s);if(nt){need(30);y+=12;doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(110);const t=doc.splitTextToSize(clean(nt),MX-M);doc.text(t,M,y);y+=t.length*11}
    cur='';
  }
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(150);doc.text(`${i} / ${n}`,MX,H-28,{align:'right'})}
  return doc.output('blob');
}

/* ---------- metronome ---------- */
let met=null,actx=null,sound=false;
function stopMet(){clearInterval(met);met=null;sound=false}
function startMet(bpm,beats,withSound){
  stopMet();if(!bpm)return;sound=withSound;let n=0;
  if(withSound){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){sound=false}}
  met=setInterval(()=>{
    const dot=$('#pulse');if(dot){dot.classList.toggle('one',n%beats===0);dot.classList.remove('on');void dot.offsetWidth;dot.classList.add('on')}
    if(sound&&actx){const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.frequency.value=n%beats?900:1400;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.09)}
    n++;
  },60000/bpm);
}

function seTeams(){const box=$('#se-teams');if(!box)return;const ts=[...new Set([...settings.teams,ed.team].filter(Boolean))];box.innerHTML=ts.map(t=>`<button type="button" class="chip pick" data-act="se-team" data-t="${esc(t)}" aria-pressed="${t===ed.team}">${esc(t)}</button>`).join('')+`<button type="button" class="chip pick" data-act="se-team" data-t="" aria-pressed="${!ed.team}">No team</button>`}

function recentUse(songId){

    const dd=Math.round((new Date(s.date+'T12:00')-d0)/864e5);if(Math.abs(dd)<=28&&dd!==0&&(!best||Math.abs(dd)<Math.abs(best.dd)))best={dd,date:s.date}}

/* ---------- reading photos (leaders) ---------- */
/* Turns the text-reader's lines, words and letter positions into a chart.
   A line made only of chords is matched letter by letter to the lyric line under it,
   so each chord lands on the syllable it sits over in the photo. */
const OCR_FIX=t=>String(t).replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/^([A-G])([a-g])(?=$|\/)/,(m,a,b)=>a.toLowerCase()===b&&b!=='b'?a:m).replace(/^([A-G])H(?=$|m|\/|\d|sus|maj|add)/,'$1#').replace(/^([A-G])(?:ff|f)(?=$|m|\/|\d)/,'$1b').replace(/\/([A-G])H$/,'/$1#');
function ocrLayout(data){
  const raw=(data&&data.lines)||[];
  const lines=raw.map(l=>({y0:l.bbox.y0,y1:l.bbox.y1,x0:l.bbox.x0,words:(l.words||[]).map(w=>({t:(w.text||'').trim(),x0:w.bbox.x0,x1:w.bbox.x1,sym:(w.symbols||[]).map(s=>({c:s.text,x0:s.bbox.x0,x1:s.bbox.x1}))})).filter(w=>w.t)})).filter(l=>l.words.length);
  if(!lines.length)return String((data&&data.text)||'').trim();
  const cws=[];lines.forEach(l=>l.words.forEach(w=>{if(w.t.length>=3)cws.push((w.x1-w.x0)/w.t.length)}));cws.sort((a,b)=>a-b);
  const cw=cws.length?cws[cws.length>>1]:12;
  const hs=lines.map(l=>l.y1-l.y0).sort((a,b)=>a-b),lh=hs[hs.length>>1]||24;
  const isChords=l=>l.words.every(w=>CHORDTOK.test(OCR_FIX(w.t))||/^(\||-|\/|N\.?C\.?|x\d+|\(x\d+\))$/i.test(w.t))&&l.words.some(w=>CHORDTOK.test(OCR_FIX(w.t)));
  const lyric=l=>{let s='';const xs=[];l.words.forEach((w,i)=>{if(i){s+=' ';xs.push(l.words[i-1].x1)}
    if(w.t==='|'||w.t==='l'&&l.words.length>1)w.t='I';
    const syms=w.sym.length===w.t.length?w.sym:null;for(let k=0;k<w.t.length;k++){s+=w.t[k];xs.push(syms?syms[k].x0:w.x0+(w.x1-w.x0)*k/w.t.length)}});return {s,xs}};
  const out=[];let prev=null;
  for(let i=0;i<lines.length;i++){
    const l=lines[i];
    if(prev&&l.y0-prev.y1>lh*1.25&&out.length&&out[out.length-1]!=='')out.push('');
    if(isChords(l)){
      const nx=lines[i+1];
      if(nx&&!isChords(nx)&&nx.y0-l.y1<lh*1.4&&!SECRX.test(nx.words.map(w=>w.t).join(' '))){
        let {s,xs}=lyric(nx);
        const chords=l.words.filter(w=>CHORDTOK.test(OCR_FIX(w.t))).map(w=>({c:OCR_FIX(w.t).replace(/[()]/g,''),x:w.x0})).sort((a,b)=>b.x-a.x);
        let limit=s.length;
        for(const ch of chords){
          let idx=-1,bestD=Infinity;
          for(let k=0;k<limit;k++){if(s[k]===' '||s[k]==='[')continue;const dd=Math.abs(xs[k]-ch.x);if(dd<bestD){bestD=dd;idx=k}}
          if(idx>=0&&ch.x>xs[xs.length-1]+cw*1.5)idx=-1;
          if(idx<0){const gap=Math.max(1,Math.round((ch.x-(xs.length?xs[xs.length-1]:nx.x0))/cw));s=s+' '.repeat(gap);idx=s.length;xs.push(...Array(gap).fill(ch.x))}
          s=s.slice(0,idx)+'['+ch.c+']'+s.slice(idx);limit=idx;
        }
        out.push(s.replace(/\s+$/,''));prev=nx;i++;continue;
      }
      out.push(l.words.map(w=>'['+OCR_FIX(w.t).replace(/[()]/g,'')+']').join(' '));prev=l;continue;
    }
    out.push(lyric(l).s);prev=l;
  }
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

let ocrLib=null,ocrWorker=null;
function loadOcr(){
  if(ocrLib)return ocrLib;
  if(window.Tesseract)return ocrLib=Promise.resolve(window.Tesseract);
  ocrLib=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=()=>ok(window.Tesseract);sc.onerror=()=>{ocrLib=null;no(new Error('load'))};document.head.appendChild(sc)});
  return ocrLib;
}
async function shrinkImage(file){
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,2400/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.92));}catch(e){return file}
}
async function scanPhotos(files){
  const st=$('#e-ocr');if(!files||!files.length||!ed)return;
  const say=m=>{if(st)st.textContent=m};
  say('Getting the text reader ready… the first time takes a little longer.');
  let T;try{T=await loadOcr()}catch(e){say('Couldn’t load the text reader. Check your connection and try again.');return}
  try{
    if(!ocrWorker)ocrWorker=await T.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text')say(`Reading the photo… ${Math.round(m.progress*100)}%`)}});
    const parts=[];
    for(let i=0;i<files.length;i++){
      say(files.length>1?`Reading photo ${i+1} of ${files.length}…`:'Reading the photo…');
      const {data}=await ocrWorker.recognize(await shrinkImage(files[i]));
      const txt=ocrLayout(data);if(txt)parts.push(txt);
    }
    if(!parts.length){say('No text found. Try a closer, brighter photo, held straight above the page.');return}
    ed.src=(ed.src.trim()?ed.src.replace(/\s+$/,'')+'\n\n':'')+parts.join('\n\n');
    const box=$('#e-src');if(box)box.value=ed.src;parseSrc();
    say('Done. Check the chart and the preview below; photos can misread a chord or a word.');
  }catch(e){say('Couldn’t read that photo. Try again with a sharper picture.')}
}

/* ---------- routing ---------- */
function route(keep){
  const h=decodeURIComponent(location.hash.slice(1));let next=null;
  if(h.startsWith('song-')){next={type:'song',id:h.slice(5)};if(!q)tab='songs'}
  else if(h.startsWith('set-')){const [sid,i]=h.slice(4).split('/');const st=setById(sid);
    if(i!==undefined&&st&&st.items[+i]){const it=st.items[+i];next={type:'song',id:it.songId,name:it.name,key:it.key,note:it.note,fromSet:sid,idx:+i}}else next={type:'set',id:sid};tab='sets'}
  else if(h==='editors')next={type:'editors'};
  else if(h==='ccli')next={type:'ccli'};
  else if(h==='sets'||h==='songs'){tab=h;next=null}
  else if(h==='new-song')next={type:'editsong',id:null};
  else if(h.startsWith('edit-song-'))next={type:'editsong',id:h.slice(10)};
  else if(h==='new-set')next={type:'editset',id:null};
  else if(h.startsWith('edit-set-'))next={type:'editset',id:h.slice(9)};
  else if(!h){next={type:'home'};tab='home'}
  if(!next||next.type!=='song')stage=false;
  if(!next||!/^edit/.test(next.type))ed=null;
  const same=keep&&sel&&next&&sel.type===next.type&&sel.id===next.id&&sel.idx===next.idx;
  if(!same){view.key=null;view.capo=0;stopMet()}
  sel=next;render();
  if(!same&&next&&next.type!=='editors')window.scrollTo(0,innerWidth<760||stage?0:scrollY);
}

  else if(a==='se-rm'){ed.items.splice(+b.dataset.i,1);seItems();seSug();seRes()}
  else if(a==='se-save')saveSetForm(false);
  else if(a==='se-del'){if(!ed.delArmed){ed.delArmed=true;b.textContent='Tap again to delete this set';return}const j=await api('deleteSet',{original:ed.orig});if(j){ed=null;D.dataset.ed='';toast('Set deleted');location.hash='sets'}}
  else if(a==='editors')location.hash='editors';
  else if(a==='refresh')load(true);
  else if(a==='lock'){lock();if(location.hash)history.replaceState(null,'',location.pathname+location.search);showGate();toast('Locked on this device')}
  else if(a==='tr'){view.key=shiftKey(view.key,+b.dataset.d);songView(D)}
  else if(a==='mode'){view.mode=b.dataset.m;remember();songView(D)}
  else if(a==='size'){view.size=Math.max(14,Math.min(40,view.size+ +b.dataset.d));remember();D.querySelector('.chart').style.setProperty('--cs',(view.size+(stage?6:0))+'px')}
  else if(a==='met'){const s=song(sel.id),ws=b.dataset.s==='1';if(met&&sound===ws)stopMet();else startMet(+s.bpm,parseInt(s.sig)||4,ws);D.querySelectorAll('[data-act=met]').forEach(x=>x.setAttribute('aria-pressed',!!met&&(x.dataset.s==='1')===sound))}
  else if(a==='ref'){q=b.dataset.r;$('#q').value=q;qRefs=parseRefs(q);tab='songs';renderList();if(innerWidth<760){sel=null;history.pushState(null,'',location.pathname+location.search);render()}toast('Songs on '+q)}
  else if(a==='pdf-song'){const s=song(sel.id),off=PART_OFF[part]||0,k=off?shiftKey(view.key,off):view.key;offerPdf([{s,key:k,capo:part==='guitar'?view.capo:0,note:sel.note||''}],{mode:view.mode},`${s.title} (${k})`)}
  else if(a==='pdf-set'){const st=setById(sel.id),mode=$('#pdfmode').value;
    const entries=st.items.map(it=>({s:song(it.songId),key:it.key,note:it.note})).filter(x=>x.s).map(x=>({...x,key:x.key||x.s.key||'C'}));
    if(!entries.length){toast('None of these songs have charts yet.');return}
    offerPdf(entries,{mode,cover:{title:st.title,sub:[fmtDate(st.date,{weekday:'long',month:'long',day:'numeric',year:'numeric'}),st.team].filter(Boolean).join('  ·  ')}},`${st.date} ${st.title}`)}
  else if(a==='copyset'){const txt=setText(setById(sel.id));try{await navigator.clipboard.writeText(txt);toast('Copied. Paste it into a text to the team.')}catch(err){D.insertAdjacentHTML('beforeend',`<label>Select and copy</label><textarea readonly style="min-height:200px">${esc(txt)}</textarea>`);D.querySelector('textarea[readonly]').select()}}
  else if(a==='ed-copy'){const o=parseSong('{title: x}\n'+$('#ed-in').value);if(!o.chart){toast('Paste a chart first.');return}toast(await copyRich(`<table><tr><td>${esc(o.chart).replace(/\n/g,'<br>')}</td></tr></table>`,o.chart)?'Copied. Paste it into the Chart cell.':'Couldn’t copy. Select the text and copy it yourself.')}
  else if(a==='imp-copy'||a==='imp-csv'){
    const rows=imp.filter(o=>o.on);if(!rows.length){toast('Tick at least one song.');return}
    if(a==='imp-csv'){const q2=v=>'"'+String(v??'').replace(/"/g,'""')+'"';saveFile(new Blob([rows.map(o=>SHEETCOLS.map(k=>q2(o[k])).join(',')).join('\n')],{type:'text/csv'}),'songs-to-add.csv');return}
    const html='<table>'+rows.map(o=>'<tr>'+SHEETCOLS.map(k=>`<td>${esc(o[k]).replace(/\n/g,'<br>')}</td>`).join('')+'</tr>').join('')+'</table>';
    const text=rows.map(o=>SHEETCOLS.map(k=>String(o[k]??'').replace(/\t/g,' ').includes('\n')?'"'+String(o[k]).replace(/"/g,'""')+'"':String(o[k]??'')).join('\t')).join('\n');
    toast(await copyRich(html,text)?`Copied ${rows.length} rows. Paste into the Songs tab.`:'Couldn’t copy. Use the CSV download instead.');
  }
});
document.addEventListener('change',e=>{const i=e.target.dataset.pi;if(i===undefined)return;imp[+i].on=e.target.checked;impList()});
$('#gate-f').addEventListener('submit',e=>{e.preventDefault();const v=$('#gate-p').value.trim();if(!v)return;store.set(KEYP,v);$('#gate-msg').textContent='Opening…';load(true)});
window.measure=measure;function measure(){const h=document.querySelector('header'),b=document.querySelector('.bar');const vis=el=>el&&getComputedStyle(el).display!=='none';
  const hh=vis(h)?h.offsetHeight:0,st=document.documentElement.style;st.setProperty('--hh',hh+'px');st.setProperty('--top',hh+(vis(b)?b.offsetHeight:0)+'px')}
addEventListener('resize',measure);if(window.ResizeObserver)new ResizeObserver(measure).observe(document.querySelector('header'));measure();
$('#q').addEventListener('input',e=>{q=e.target.value.trim();qRefs=parseRefs(q);render()});
$('#team').addEventListener('change',e=>{team=e.target.value;remember();if(sel&&sel.type==='song'&&!sel.key)view.key=null;render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(document.body.classList.contains('stage'))wakeOn();if(Date.now()-loadedAt>120000)load()}});

/* ---------- start ---------- */
const cached=API&&store.get(KEYP)?store.get(KEYC):null;
if(cached&&Array.isArray(cached.songs)){build(cached);loadedAt=cached.at;paint();status()}else route(true);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
setInterval(()=>{if(!loading&&loadedAt)status()},60000);
}
</script>
</body>
</html>
